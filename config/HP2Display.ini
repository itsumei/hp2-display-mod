[Display]
; Auto selects the highest mode supported at the current fullscreen resolution.
; A number sets a ceiling in Hz. 0 keeps the game's choice.
MaxRefreshHz=Auto
; -1 keeps the game's choice. 0 presents immediately. 1 waits for vertical sync in fullscreen.
VSync=1
; Software frame cap in FPS. 0 disables it. This does not select the monitor refresh rate.
FrameLimit=0

[Graphics]
; 8 is the default. The driver may fall back to 4 or 2. Set 0 to keep the game's settings.
MSAA=8
; 0 keeps the game's 128x128 car reflections. Try 256, 512 or 1024 and restart.
ReflectionSize=0

[Interpolation]
; Smooth the race camera and car models together. Set to 0 and restart to disable both.
Camera=1
; Keep cars at the same simulation step as the camera during view switches. 0 restores the old behavior.
SyncCameraCuts=1

[Overlay]
; Set to 0 and restart the game to hide the FPS counter.
ShowFPS=1

[Diagnostics]
; Record successful Present calls, simulation ticks and interpolated frames. 0 disables sampling.
SampleSeconds=0
; Capture the first race to a CSV after this many seconds. 0 disables capture.
FrameTraceSeconds=0
